[project]
name = "tatibana-bot"
version = "0.1.0"
description = "AI-assisted day trading bot for Japanese stocks using Tachibana Securities e-shiten API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "anthropic>=0.92",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
