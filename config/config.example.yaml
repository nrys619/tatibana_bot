# config.yaml にコピーして使用 (config.yaml は .gitignore 済み)

api:
  # demo: デモ環境 / prod: 本番環境
  env: demo
  # 認証方式:
  #   pubkey   (v4r9〜, 推奨): 認証ID + RSA秘密鍵。環境変数で
  #            TACHIBANA_AUTH_ID_FILE / TACHIBANA_PRIVATE_KEY_FILE を指定
  #   password (v4r8以前): TACHIBANA_USER_ID / TACHIBANA_PASSWORD
  # ※ デモと本番では認証ID・鍵ペアが別物。混用しないこと
  auth_method: pubkey
  # e支店APIのバージョン文字列。立花証券の最新API仕様書で確認して合わせること
  version: e_api_v4r9
  base_urls:
    demo: https://demo-kabuka.e-shiten.jp
    prod: https://kabuka.e-shiten.jp
  timeout_sec: 10

paths:
  data_dir: data
  models_dir: models
  logs_dir: logs
  watchlist: data/watchlist.json

universe:
  # スクリーニング対象銘柄 (東証コード)。実運用では TOPIX500 等に拡張する
  codes: ["7203", "6758", "9984", "8306", "6501", "7974", "6098", "8035", "4063", "9432"]
  # 松井証券の公開ランキングから銘柄候補を自動追加する (夜間バッチ)
  matsui:
    enabled: true
    # 使うランキング: day_trading_morning/afternoon, tick, volume, volume_surge,
    #                trading_value, trading_value_surge, rise, fall, interval_rise, interval_fall
    rankings: ["day_trading_afternoon", "tick", "volume_surge", "trading_value"]
    market: 0     # 0=全体 1=プライム 2=スタンダード 3=グロース
    top_k: 50     # 各ランキングの上位何銘柄を候補に入れるか

screening:
  top_n: 30                # 監視リストに載せる銘柄数
  min_turnover_jpy: 1.0e+9  # 最低売買代金 (流動性フィルタ)
  record_extra: 20          # 監視の次点20銘柄は「記録専用」(取引せずML用に録画)
  label_range_pct: 3.0     # 「翌日この値幅%以上動いたらデイトレ向き」のラベル閾値
  history_days: 750

disclosure:
  model: claude-opus-4-8    # 最高性能なら claude-fable-5 (2倍の料金)、コスト重視なら claude-haiku-4-5
  max_docs_per_run: 50
  min_impact_for_watchlist: 3

# 売買コスト: 記録される損益からこれを引いた値が実質の損益 (pnl_net)
# 2026-07-30まで実機の損益はコストを一切引いておらず、実際より良く見えていた
costs:
  slippage_bps: 2.0       # 成行決済の滑り (片道bp)
  commission_jpy: 0       # 1取引あたりの手数料 (デモは0。実口座では実額を入れる)

signals:
  imbalance_entry: 0.4      # 板の買い/売り不均衡の閾値
  # 有名デイトレーダー手法のフィルタ (バックテストで選抜、毎日再検証)
  trend_filter: true        # cis流: 5分前より上の時だけ買う (下なら売りのみ)
  volume_surge: true        # テスタ流: 約定が平常時の2倍以上の時だけ入る
  absorption: true          # テスタ流: 反対側の板が食われている時だけ入る
  breakout_only: false      # cis流: 本日高値/安値圏ブレイクのみ (現在OFF)
  tape_ratio_entry: 0.6     # 歩み値の買い約定比率の閾値
  max_spread_bps: 8         # ②スプレッドがこれ以上開いていたらエントリーしない
  target_pct: 0.8           # 利確幅 (%)
  stop_pct: 0.25            # 損切り幅 (%) 2026-07-28: 実機でストップ決済16戦全敗
                            # (-20,420円)。板再生18日でも0.4%→0.25%が+1,850→+13,300
  max_hold_sec: 1800        # 最大保有時間 (秒)
  trailing_pct: 0.3         # ⑤ピークからこの%押したら決済 (0で固定利確に戻る)
  min_range_pct: 0.3        # B: 直近5分の値幅がこれ未満の銘柄は見送り
  loss_cooldown_sec: 1800   # E: 負けた銘柄は30分出禁
  # 探索モード: 惜しい合図を最小サイズ(100株・株価3000円以下限定)で試す
  explore:
    enabled: true
    imbalance_entry: 0.35   # 本命(0.4)より少し緩い
    surge_ratio: 1.2        # 本命(2.0)よりかなり緩い
    daily_loss_cap: 5000    # 探索の損失が1日これに達したら探索だけ停止
  entry_windows:            # ③新規エントリーを許可する時間帯
    - ["09:00", "10:00"]
    - ["14:30", "15:00"]

risk:
  equity_jpy: 1000000       # 運用資金
  risk_per_trade: 0.005     # 1トレードで許容する損失 (資金比)
  max_position_value: 300000
  max_total_exposure: 2500000  # 建玉総額の上限 (信用余力の範囲内)
  daily_loss_limit: 0.02    # 日次損失がこの比率に達したら当日停止
  max_consecutive_losses: 4
  price_shock_bps: 300      # 急変警報の入場ブロック閾値 (2分でこのbps超のみ。データ異常は別途3%ガードが担当)
  regime_index: "^N225"     # 地合い判定に使う指数

engine:
  mode: paper               # paper: 発注せずログのみ / live: 実発注
  poll_interval_sec: 1.0
  maker_entry: true         # ①新規は指値で入る (未約定なら8秒で取消)
  fill_timeout_sec: 8
  record_snapshots: true    # 板スナップショットを保存 (③のML学習データになる)
  # 場中に松井デイトレ適性ランキングで監視リストを入れ替える
  intraday_scan:
    enabled: true
    interval_sec: 300         # 5分おき
